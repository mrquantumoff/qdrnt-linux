name: Monthly ISO
# Builds the qdrnt ISO and publishes it two ways: a GitHub release with the ISO
# in <2 GiB parts (GitHub's asset limit), the checksum and the package list,
# and a single-file upload to SourceForge (skipped without its secrets).
#
# Secrets: SF_SSH_KEY (private key), SF_USER, SF_PROJECT, optional SF_API_KEY
# (Releases API key: makes the new ISO the project's default download).

on:
  schedule:
    - cron: "0 4 1 * *" # 04:00 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iso-build
  cancel-in-progress: false

env:
  SF_HOST: frs.sourceforge.net

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build ISO
        run: |
          docker run --rm --privileged -v "$PWD:/src" -w /src cachyos/cachyos:latest \
            bash scripts/ci-build.sh
          sudo chown -R "$(id -u):$(id -g)" out

      # Step outputs that contain a secret value are dropped by GitHub, and the
      # ISO name may contain the project name, so later steps re-derive it.
      - name: Prepare release assets
        id: assets
        run: |
          set -euo pipefail
          iso="$(ls out/desktop/qdrnt-*.iso)"
          name="$(basename "$iso")"
          mkdir -p release
          (cd out/desktop && sha256sum "$name") > "release/${name}.sha256"
          cp out/desktop/*.pkgs.txt release/

          # GitHub release assets are capped at 2 GiB.
          split --bytes=1900M --numeric-suffixes=1 --suffix-length=2 "$iso" "release/${name}.part"

          if [[ -n "$SF_SSH_KEY" && -n "$SF_USER" && -n "$SF_PROJECT" ]]; then
            echo "sourceforge=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SourceForge secrets missing: GitHub download only"
            echo "sourceforge=false" >> "$GITHUB_OUTPUT"
          fi
          ls -lh release

          tag="v$(date -u +%Y.%m.%d)"
          if gh release view "$tag" >/dev/null 2>&1; then
            tag="${tag}.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
          SF_USER: ${{ secrets.SF_USER }}
          SF_PROJECT: ${{ secrets.SF_PROJECT }}

      - name: Upload to SourceForge
        if: steps.assets.outputs.sourceforge == 'true'
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SF_SSH_KEY" > ~/.ssh/sourceforge
          chmod 600 ~/.ssh/sourceforge
          ssh-keyscan -t ed25519,rsa "$SF_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh_cmd="ssh -i $HOME/.ssh/sourceforge -o BatchMode=yes"

          iso="$(ls out/desktop/qdrnt-*.iso)"
          name="$(basename "$iso")"
          dest="/home/frs/project/${SF_PROJECT}/${TAG}/"
          for attempt in 1 2 3; do
            if rsync -av --progress -e "$ssh_cmd" "$iso" "release/${name}.sha256" \
                "${SF_USER}@${SF_HOST}:${dest}"; then
              break
            fi
            [[ $attempt -eq 3 ]] && exit 1
            echo "upload failed, retrying in 30s"; sleep 30
          done

          if [[ -n "${SF_API_KEY:-}" ]]; then
            # Make this ISO the default download for every platform.
            curl -fsS -X PUT -H "Accept: application/json" \
              -d "default=windows&default=mac&default=linux&default=bsd&default=solaris&default=others" \
              -d "api_key=${SF_API_KEY}" \
              "https://sourceforge.net/projects/${SF_PROJECT}/files/${TAG}/${name}" >/dev/null \
              && echo "set as default download" \
              || echo "::warning::could not set the default download (check SF_API_KEY)"
          fi
          rm -f ~/.ssh/sourceforge
        env:
          TAG: ${{ steps.assets.outputs.tag }}
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
          SF_USER: ${{ secrets.SF_USER }}
          SF_PROJECT: ${{ secrets.SF_PROJECT }}
          SF_API_KEY: ${{ secrets.SF_API_KEY }}

      - name: Publish release
        run: |
          set -euo pipefail
          name="$(basename "$(ls out/desktop/qdrnt-*.iso)")"
          {
            echo "Monthly qdrnt ISO build (CachyOS live, COSMIC). Installer branch: \`qdrnt\` of mrquantumoff/cachyos-calamares."
            echo
            echo "## Download"
            echo
            if [[ "$SOURCEFORGE" == "true" ]]; then
              url="https://sourceforge.net/projects/${SF_PROJECT}/files/${TAG}/${name}/download"
              echo "**Option 1: SourceForge (single file, about 3 GB):** [${name}](${url})"
              echo
              echo "**Option 2: GitHub (in parts):** see below."
              echo
            fi
            cat <<EOF
          ### GitHub (in parts)

          GitHub limits release files to 2 GiB, so the ISO is split into parts. Download every \`${name}.partNN\` file from the assets below, then join them:

          \`\`\`sh
          cat ${name}.part* > ${name}
          \`\`\`

          On Windows (PowerShell):

          \`\`\`powershell
          cmd /c copy /b "${name}.part*" "${name}"
          \`\`\`

          ## Verify

          Check either download against the \`.sha256\` below:

          \`\`\`sh
          sha256sum -c ${name}.sha256
          \`\`\`

          On Windows: \`Get-FileHash ${name} -Algorithm SHA256\`, and compare with the \`.sha256\` file.
          EOF
          } > notes.md
          gh release create "$TAG" release/* --title "qdrnt $TAG" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          SOURCEFORGE: ${{ steps.assets.outputs.sourceforge }}
          SF_PROJECT: ${{ secrets.SF_PROJECT }}
